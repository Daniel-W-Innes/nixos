name: Test NixOS Configurations

on:
  pull_request: {}
  push:
    branches: [ "master" ]

jobs:
  test:
    strategy:
      matrix:
        host: [melon]
    runs-on: ${{ matrix.host }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build system configuration for ${{ matrix.host }}
        run: nh os build . 