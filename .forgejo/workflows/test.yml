name: Test Nix

on:
  pull_request: {}
  push:
    branches: [ "master" ]

jobs:
  test:
    strategy:
      matrix:
        host: [ melon, onion ]
    runs-on: ${{ matrix.host }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          path: pr

      - name: Build PR configuration
        id: build-pr
        run: |
          cd pr
          new=$(nixos-rebuild build --flake . 2>&1 | tail -1 | awk '{print $NF}')
          echo "NEW_PATH=$new" >> "$GITHUB_OUTPUT"
        env:
          PATH: /run/current-system/sw/bin:$PATH

      - name: Diff from current system to PR
        run: |
          nix shell ./pr#nixpkgs.legacyPackages.x86_64-linux.dix -c dix /run/current-system ${{ steps.build-pr.outputs.NEW_PATH }}
        env:
          PATH: /run/current-system/sw/bin:$PATH

      - name: Checkout base branch (master)
        uses: actions/checkout@v5
        with:
          ref: master
          path: base

      - name: Build base configuration (master)
        id: build-base
        run: |
          cd base
          old=$(nixos-rebuild build --flake . 2>&1 | tail -1 | awk '{print $NF}')
          echo "OLD_PATH=$old" >> "$GITHUB_OUTPUT"
        env:
          PATH: /run/current-system/sw/bin:$PATH

      - name: Diff from master to PR
        run: |
          nix shell ./pr#nixpkgs.legacyPackages.x86_64-linux.dix -c dix ${{ steps.build-base.outputs.OLD_PATH }} ${{ steps.build-pr.outputs.NEW_PATH }}
        env:
          PATH: /run/current-system/sw/bin:$PATH
