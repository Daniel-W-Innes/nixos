name: Test Nix

on:
  pull_request: {}
  push:
    branches: [ "master" ]

jobs:
  test:
    strategy:
      matrix:
        host: [melon]
    runs-on: ${{ matrix.host }}
    steps:
      - name: Verify token
        shell: bash
        run: |
          if [ -z "$CHECKOUT_TOKEN" ]; then
            echo "::error::CHECKOUT_TOKEN is empty. Secret not available."
            exit 1
          fi
          echo "Token is available (length: ${#CHECKOUT_TOKEN})"
          # Test that the token can read the repository
          curl -fsS -H "Authorization: token $CHECKOUT_TOKEN" \
            "https://git.lc.brotherwolf.ca/api/v1/repos/Daniel-W-Innes/nixos" \
            | grep -q '"name":"nixos"' && echo "Repository access OK" || echo "Repository access FAILED"
        env:
          CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CHECKOUT_TOKEN }}
      - name: Build system configuration
        run: nh os build .