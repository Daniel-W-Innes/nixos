name: Test Nix

on:
  pull_request: {}
  push:
    branches: [ "master" ]

jobs:
  test:
    strategy:
      matrix:
        host: [ melon, onion ]
    runs-on: ${{ matrix.host }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          path: pr

      - name: Build PR configuration
        id: build-pr
        run: |
          cd pr
          new=$(nixos-rebuild build --flake . 2>&1 | tail -1 | awk '{print $NF}')
          echo "NEW_PATH=$new" >> "$GITHUB_OUTPUT"
        env:
          PATH: /run/current-system/sw/bin:$PATH

      - name: Diff from current system to PR
        run: |
          nix shell --inputs-from ./pr nixpkgs#dix -c dix /run/current-system ${{ steps.build-pr.outputs.NEW_PATH }}
        env:
          PATH: /run/current-system/sw/bin:$PATH

      - name: Checkout base branch (master)
        uses: actions/checkout@v5
        with:
          ref: master
          path: base

      - name: Build base configuration (master)
        id: build-base
        run: |
          cd base
          old=$(nixos-rebuild build --flake . 2>&1 | tail -1 | awk '{print $NF}')
          echo "OLD_PATH=$old" >> "$GITHUB_OUTPUT"
        env:
          PATH: /run/current-system/sw/bin:$PATH

      - name: Diff from master to PR
        run: |
          nix shell --inputs-from ./pr nixpkgs#dix -c dix ${{ steps.build-base.outputs.OLD_PATH }} ${{ steps.build-pr.outputs.NEW_PATH }}
        env:
          PATH: /run/current-system/sw/bin:$PATH

      # Boots the PR configuration in a VM and asserts activation +
      # switch-to-configuration run cleanly. No host state is shared (the
      # unprivileged runner cannot read it — see docs/testing.md). The
      # runner's nix daemon must advertise the kvm and nixos-test system
      # features.
      - name: VM switch smoke test
        run: |
          cd pr
          nix build --no-link --print-build-logs ".#checks.x86_64-linux.${{ matrix.host }}-vm-test"
        env:
          PATH: /run/current-system/sw/bin:$PATH

      # The real base -> PR transition: boots the PR configuration, switches
      # to a VM-adapted generation of the base flake, and back — unit
      # restarts in both directions against the PR's activation logic.
      # Still no host state; the base generation is re-evaluated with the
      # VM adapter module so activation works without secrets (see
      # docs/testing.md).
      - name: VM switch transition test (base → PR)
        run: |
          cd pr
          pr_dir="$(realpath .)"
          base_dir="$(realpath ../base)"
          nix build --no-link --print-build-logs --impure --expr \
            "let pr = builtins.getFlake \"path:$pr_dir\"; in (pr.lib.vmTransitionTests.${{ matrix.host }} \"path:$base_dir\").test"
        env:
          PATH: /run/current-system/sw/bin:$PATH
