name: Update Nix

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch: {}
  push:
    branches:
      - update-workflow

jobs:
  update:
    runs-on: debian
    steps:
      - uses: actions/checkout@v5

      - uses: https://github.com/DeterminateSystems/nix-installer-action@v22

      - name: Run nix flake update
        run: nix flake update

      # Debug: check runner environment
      - name: Debug environment
        run: |
          echo "GITHUB_SERVER_URL=$GITHUB_SERVER_URL"
          echo "GITHUB_API_URL=$GITHUB_API_URL"
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
          echo "GITHUB_REF=$GITHUB_REF"
          git remote -v

      # Test token validity against the Forgejo API
      - name: Test token
        run: |
          curl -sf -H "Authorization: token ${{ secrets.UPDATE_TOKEN }}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY" || {
            echo "Token failed to access the repo API"
            exit 1
          }
          curl -sf -H "Authorization: token ${{ secrets.UPDATE_TOKEN }}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches" | python3 -c "import sys,json; [print(b['name']) for b in json.load(sys.stdin)]"

      - name: Push and create Pull Request
        env:
          TOKEN: ${{ secrets.UPDATE_TOKEN }}
          BRANCH: update/flake-inputs
          BASE: master
          REPO: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail

          # Configure git to use the token for push
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit changes (if any)
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add -A
            git commit -m "flake: update inputs"
          fi

          # Push using token authentication
          # Forgejo accepts token as username with empty password
          git push \
            "https://${TOKEN}@git.lc.brotherwolf.ca/${REPO}.git" \
            "HEAD:refs/heads/${BRANCH}" --force-with-lease

          # Check if a PR already exists for this branch
          PR_NUMBER=$(curl -sf -H "Authorization: token ${TOKEN}" \
            "${API_URL}/repos/${REPO}/pulls?state=open&head=Daniel-W-Innes:${BRANCH}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['number'])" 2>/dev/null || true)

          if [ -n "${PR_NUMBER}" ]; then
            echo "Pull request #${PR_NUMBER} already exists — updating..."
            # Update PR title/body if needed (optional)
            curl -sf -X PATCH \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"title":"flake: update inputs"}' \
              "${API_URL}/repos/${REPO}/pulls/${PR_NUMBER}"
          else
            echo "Creating new pull request..."
            curl -sf -X POST \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg title "flake: update inputs" \
                        --arg head  "${BRANCH}" \
                        --arg base  "${BASE}" \
                        '{title:$title, head:$head, base:$base, body:"Automated flake update."}')" \
              "${API_URL}/repos/${REPO}/pulls"
          fi
