name: Update Nix

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch: {}

enable-openid-connect: true

jobs:
  update:
    # Native (host) execution, like test.yml: container jobs on the docker://
    # labels are broken since podman 5.8.7 rejects the runner's copy of JS
    # actions into /var/run/act ("path escapes from parent",
    # forgejo/runner#1524, #1758). The hosts already have nix, so
    # nix-installer-action is unnecessary.
    runs-on: native
    steps:
      - uses: actions/checkout@v5

      - name: Run nix flake update
        env:
          PATH: /run/current-system/sw/bin:$PATH
        run: nix flake update

      - name: fetch jwt
        id: jwt
        env:
          AUD: u:1:1020a296-c478-4c7e-bfa2-15e584090441
        run: |
          set -euo pipefail

          jwt=$( \
            curl --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" \
            | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).value)" \
          )
          echo "::add-mask::$jwt"
          echo "jwt=$jwt" >> $FORGEJO_OUTPUT

      - name: Push and create Pull Request
        env:
          JWT: ${{ steps.jwt.outputs.jwt }}
          BRANCH: update/flake-inputs
          BASE: master
          REPO: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add -A
            git commit -m "flake: update inputs"
          fi

          # Force-push the updated lockfile to the PR branch
          git -c "http.${SERVER_URL}/.extraHeader=Authorization: Bearer ${JWT}" \
            push origin "HEAD:refs/heads/${BRANCH}" --force

          # PR creation / update using Forgejo REST API
          PR_NUMBER=$(curl -sf -H "Authorization: Bearer ${JWT}" \
            "${API_URL}/repos/${REPO}/pulls?state=open&head=Daniel-W-Innes:${BRANCH}" \
            | node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync(0,'utf8'))[0].number))" 2>/dev/null || true)

          if [ -n "${PR_NUMBER}" ]; then
            echo "Pull request #${PR_NUMBER} already exists — updating..."
            curl -sf -X PATCH \
              -H "Authorization: Bearer ${JWT}" \
              -H "Content-Type: application/json" \
              -d '{"title":"flake: update inputs"}' \
              "${API_URL}/repos/${REPO}/pulls/${PR_NUMBER}"
          else
            echo "Creating new pull request..."
            PAYLOAD=$(printf \
              '{"title":"flake: update inputs","head":"%s","base":"%s","body":"Automated flake update."}' \
              "${BRANCH}" "${BASE}")
            curl -sf -X POST \
              -H "Authorization: Bearer ${JWT}" \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}" \
              "${API_URL}/repos/${REPO}/pulls"
          fi
