name: Update Nix

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch: {}
  pull_request: {}

enable-openid-connect: true

jobs:
  update:
    runs-on: debian
    steps:
      - uses: actions/checkout@v5

      - uses: https://github.com/DeterminateSystems/nix-installer-action@main

      - name: Run nix flake update
        run: nix flake update

      - name: fetch jwt
        id: jwt
        env:
          AUD: u:1:1020a296-c478-4c7e-bfa2-15e584090441
        run: |
          jwt=$( \
            curl --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])" \
          )
          echo "::add-mask::$jwt"
          echo "jwt=$jwt" >> $FORGEJO_OUTPUT

      - name: Create/Update Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'flake: update inputs'
          title: 'flake: update inputs'
          branch: update/flake-inputs
          base: master
          delete-branch: true
          token: ${{ steps.jwt.outputs.jwt }}
